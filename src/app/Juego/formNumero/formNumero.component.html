<form [formGroup]="formNumero">
  <div class="container">
  <div class="col">
    <div class="row">
      <input type="text" class="form-control" placeholder="Introduce un número" formControlName="numero" />
    </div>
    <div class="row">
      <button type="button" class="btn btn-primary" (click)="enviar()">Enviar</button>
    </div>
  </div>
</div>
</form>
